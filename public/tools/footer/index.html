<!doctype html>
<html>
	<head>
		<style>
			@font-face {
				font-family: 'Gotham';
				src: url('./Gotham Black Regular/Gotham Black Regular.ttf');
			}

			body {
				padding: 0;
				margin: 0;
				font-family: Gotham;
				color: white;
				--beige: #feef8b;
			}

			.beige {
				color: var(--beige);
			}

			@keyframes fadeIn {
				from {
					opacity: 0;
				}
				to {
					opacity: 1;
				}
			}

			#footer > div {
				position: absolute;
				top: 0;
				left: 0;
				opacity: 0;
				overflow: hidden;
				width: 1920px;
				height: 57px;
				font-size: 38px;
				line-height: 57px;
				text-align: left;
			}

			#footer .item {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				display: none;
				white-space: nowrap;
			}

			#footer .item.active {
				display: block;
				animation: fadeIn ease 1s;
				animation-fill-mode: forwards;
			}

			#footer .item.overflowing .wrapper {
				display: inline-block;
				will-change: transform;
				animation: revealGraphic 11s linear infinite;
			}

			@keyframes revealGraphic {
				0% {
					transform: translateX(0);
				}
				100% {
					/* Move it left by exactly the overflow amount */
					transform: translateX(calc(-1px * var(--overflow-distance)));
				}
			}
		</style>
	</head>
	<body>
		<div id="footer">
			<div class="item ctsc26 active">
				<img src="./ctsc26.png" />
			</div>
			<div class="item socials">
				<img src="./socials.png" />
			</div>
			<div class="item merch">
				<img src="./merch.png" />
			</div>
			<div class="item matcherino">
				<img src="./matcherino.png" />
			</div>
			<div class="item blank">
				<img src="./blank.png" />
			</div>
			<div class="item razer">
				<div class="wrapper">
					<img src="./razer.png" /><img src="./razer.png" />
				</div>
			</div>
		</div>

		<script type="text/javascript">
			const CYCLE_DURATION_S = 10;

			// 1. get query string args and do initial setup
			const footers = [...document.querySelectorAll('#footer .item')];

			let curr_index = footers.length - 1;
			let curZIndex = 1;

			function run() {
				const old_footer = footers[curr_index];
				old_footer.style.zIndex = ++curZIndex;

				curr_index = (curr_index + 1) % footers.length;

				const new_footer = footers[curr_index];
				new_footer.style.zIndex = ++curZIndex;
				new_footer.onanimationend = e => {
					if (e.animationName === 'fadeIn') {
						old_footer.classList.remove('active');
						old_footer.classList.remove('overflowing');
					}
				};
				new_footer.classList.add('active');

				const containerWidth =
					new_footer.getBoundingClientRect().width || new_footer.clientWidth;
				const contentWidth = new_footer.scrollWidth;

				if (contentWidth > containerWidth) {
					const overflowDistance = contentWidth - containerWidth;
					new_footer.style.setProperty('--overflow-distance', overflowDistance);
					new_footer.classList.add('overflowing');
				}
			}

			let cycle_duration_s = CYCLE_DURATION_S;

			setInterval(run, cycle_duration_s * 1000);
		</script>
	</body>
</html>
